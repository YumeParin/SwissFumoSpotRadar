name: Deploy to Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Run remote deploy commands
    runs-on: ubuntu-latest
    environment: PRODUCTION
    steps:
      - name: Execute remote deploy script
        uses: appleboy/ssh-action@v1
        id: ssh
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          capture_stdout: true
          script: |
            cd /main/SwissFumoSpotRadar
            echo "🚀 Starting Swiss Fumo Radar Deployment..."

            echo "1. Fetch latest code from GitHub"
            git fetch origin main
            git reset --hard origin/main
            echo "WEBHOOK_URL=${{ secrets.WEBHOOK_URL }}" > .env
            chmod +x deploy.sh
            ./deploy.sh

      - name: Use captured output
        run: echo "SSH output was ${{ steps.ssh.outputs.stdout }}"
